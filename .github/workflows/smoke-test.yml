name: Smoke tests
on:
  push:
    paths:
      - ".github/workflows/smoke-test.yml"
      - "Casks/*.rb"
      - "Formula/*.rb"
      - "Tests/**"
  schedule:
    - cron: "30 16 2 * *"
  workflow_dispatch:
    inputs:
      app:
        description: App name to test, or "all"
        required: true
        default: all
        type: string
permissions:
  contents: read
jobs:
  detect:
    name: Detect smoke-test targets
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.targets.outputs.apps }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REQUESTED_APP: ${{ inputs.app }}
        run: |
          case "$EVENT_NAME" in
            push)
              mode=changed
              ;;
            workflow_dispatch)
              if [[ "$REQUESTED_APP" == "all" ]]; then
                mode=all
              else
                mode=app
              fi
              ;;
            schedule)
              mode=all
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          args=(--mode "$mode")
          if [[ "$mode" == "changed" ]]; then
            args+=(--base "$BEFORE_SHA" --head "$CURRENT_SHA")
          elif [[ "$mode" == "app" ]]; then
            args+=(--app "$REQUESTED_APP")
          fi

          apps="$(bash Tests/detect-targets.sh "${args[@]}")"
          if [[ "$apps" == "[]" ]]; then
            count=0
          else
            separators="${apps//[^,]/}"
            count=$((${#separators} + 1))
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
  smoke-test:
    name: ${{ matrix.app }} (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Enable Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
      - name: Install ShellSpec
        env:
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew update
          brew install shellspec/shellspec/shellspec
          shellspec -v
      - name: Install and smoke-test app
        env:
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: bash Tests/run-smoke-test.sh "${{ matrix.app }}"
      - name: Verify generated definitions are unchanged
        if: always()
        run: git diff --exit-code -- Casks Formula
